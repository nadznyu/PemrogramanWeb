<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Petugas - SIMPUS-Mini</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="buku/index.html">Buku</a></li>
                <li><a href="Anggota/index.html">Anggota</a></li>
            </ul>
        </nav>
    </header>
    
    <main class="container">
        <section class="card">
            <h2>Login Petugas</h2>
            <form action="#" metode="POST">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </div>

                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p style="margin-top: 15px;">Belum punya akun? <a href="#">Daftar di sini</a></p>
        </section>
    </main>
</body>
</html>
