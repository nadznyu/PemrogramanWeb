<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Login Anggota</title>
</head>

<body
    style="margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background-color: #f5f6f8; display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div
        style="background-color: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); width: 100%; max-width: 380px;">
        <h2 style="text-align: center; color: #1d5b8a; margin-top: 0; margin-bottom: 25px;">LOGIN ANGGOTA</h2>

        <form>
            <div style="margin-bottom: 15px;">
                <label for="username"
                    style="display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px;">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username" required
                    style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="password"
                    style="display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px;">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required
                    style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <button type="submit"
                style="width: 100%; padding: 10px; background-color: #1d5b8a; color: #fff; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">Masuk</button>

            <p style="text-align: center; font-size: 13px; margin-top: 15px; color: #666;">
                Belum punya akun? <a href="#" style="color: #1d5b8a; text-decoration: none; font-weight: 600;">Daftar di
                    sini</a>
            </p>
        </form>
    </div>

</body>

</html>
